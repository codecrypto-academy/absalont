services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: rust-web-backend
    ports:
      - "8001:8001"
    volumes:
      - ./back/northwind.db:/app/northwind.db
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8001/customers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        - API_URL=http://backend:8001
    container_name: rust-web-frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:8001
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
