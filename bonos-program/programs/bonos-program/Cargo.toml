[package]
name = "bonos-program"
version = "0.1.0"
description = "Solana Bonds DApp — On-chain bond lifecycle management"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bonos_program"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.0", features = ["token"] }
